<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Vibe Seekers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(124,58,237,0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(168,85,247,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .login-box {
      background: rgba(17,17,24,0.9);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 20px;
      padding: 48px 40px;
      width: 420px;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
    }
    .login-title { font-size: 24px; font-weight: 700; color: #e2e8f0; }
    .login-sub { font-size: 14px; color: #64748b; margin-top: 4px; }
    .flash { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    .flash-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .flash-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    input {
      width: 100%; padding: 12px 16px;
      background: rgba(26,26,36,0.8);
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,58,237,0.4); }
    .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
    .back-link a { color: #a855f7; text-decoration: none; }
    .back-link a:hover { color: #c084fc; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="logo-icon">V</div>
    <div class="login-title">Admin Portal</div>
    <div class="login-sub">Sign in to manage your store</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
      <label for="admin-email">Email Address</label>
      <input type="email" id="admin-email" name="email" placeholder="admin@vibeseekers.com" required autofocus/>
    </div>
    <div class="form-group">
      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" name="password" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn-login">Sign In to Admin Panel</button>
  </form>

  <div class="back-link">
    <a href="{{ url_for('main.index') }}">← Back to Store</a>
  </div>
</div>
</body>
</html>
