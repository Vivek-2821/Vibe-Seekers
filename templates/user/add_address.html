{% extends "user/base_user.html" %}
{% block user_content %}
<h1 style="font-family:var(--font-display);font-size:2rem;font-weight:300;margin-bottom:32px">Add New Address</h1>
<div style="max-width:600px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px">
  <form method="POST" action="{{ url_for('user.add_address') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Full Name *</label><input type="text" name="full_name" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Phone *</label><input type="tel" name="phone" class="form-control" required></div>
    </div>
    <div class="form-group"><label class="form-label">Address Line 1 *</label><input type="text" name="address_line1" class="form-control" required></div>
    <div class="form-group"><label class="form-label">Address Line 2</label><input type="text" name="address_line2" class="form-control"></div>
    <div class="grid-3">
      <div class="form-group"><label class="form-label">City *</label><input type="text" name="city" class="form-control" required></div>
      <div class="form-group"><label class="form-label">State *</label><input type="text" name="state" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Pincode *</label><input type="text" name="pincode" class="form-control" required maxlength="6"></div>
    </div>
    <label class="form-check mb-3"><input type="checkbox" name="is_default"> <span style="font-size:.85rem">Set as default address</span></label>
    <div style="display:flex;gap:12px">
      <button type="submit" class="btn btn-primary">Save Address</button>
      <a href="{{ url_for('user.addresses') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
