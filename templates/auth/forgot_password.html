{% extends "base.html" %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="section-subtitle mb-1">Password Reset</div>
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <!-- Bot Honeypot field (hidden from real users) -->
      <div style="display:none;" aria-hidden="true">
        <input type="text" name="website_url" id="forgot_website_url" tabindex="-1" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
    </form>
    <div class="auth-footer-text"><a href="{{ url_for('auth.login') }}">← Back to Sign In</a></div>
  </div>
</div>
{% endblock %}
{% block no_footer %}{% endblock %}
